<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos
   //COLORES DEL MARCO
var colorMarco = new THREE.MeshLambertMaterial({ color: 0x8B4513 }) 

//MARCO DEL RETRATO
var arriba = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 0.4), colorMarco)
//scene.add(arriba)
arriba.position.set(0, 4, 0)

var abajo = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 0.4), colorMarco)
//scene.add(abajo)
abajo.position.set(0, -4, 0)

var izquierda = new THREE.Mesh(new THREE.BoxGeometry(0.4, 8, 0.4), colorMarco)
//scene.add(izquierda)
izquierda.position.set(-3.8, 0, 0)

var derecha = new THREE.Mesh(new THREE.BoxGeometry(0.4, 8, 0.4), colorMarco)
//scene.add(derecha)
derecha.position.set(3.8, 0, 0)

//IMAGEN
var textura = new THREE.TextureLoader().load('imagenes/3.jpg') 
var fondoMat = new THREE.MeshLambertMaterial({ map: textura })
var fondoGeo = new THREE.PlaneGeometry(7, 7)
var fondo = new THREE.Mesh(fondoGeo, fondoMat)
//scene.add(fondo)
fondo.position.set(0, 0, -0.21) 

      

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
