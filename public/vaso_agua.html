<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos

/// LUCES
 var luces = new THREE.PointLight(0xFFFFFF,1.5);
 luces.position.set(50,50,50);
 scene.add(luces);





/////////////////////////////////////////////// ESPACIO PARA OBJETOS



// PLANO
/*
var geometryPlano = new THREE.BoxGeometry(80, 0.5, 80);
var materialPlano = new THREE.MeshLambertMaterial({ color: 0xAAAAAA });
var meshPlano = new THREE.Mesh(geometryPlano, materialPlano);
scene.add(meshPlano);
meshPlano.position.set(0, 0, 0);*/

///// VASO CON AGUA /////

// Parte exterior del vaso (un cilindro transparente)
var geometryVaso = new THREE.CylinderGeometry(6, 5, 12, 32, 1, true); 
var materialVaso = new THREE.MeshPhongMaterial({
  color: 0x87CEFA,     // tono azul claro
  transparent: true,
  opacity: 0.3,        // transparente
  side: THREE.DoubleSide
});
var vaso = new THREE.Mesh(geometryVaso, materialVaso);
scene.add(vaso);
vaso.position.set(0, 6, 0);

// Base del vaso
var geometryBase = new THREE.CircleGeometry(5, 32);
var materialBase = new THREE.MeshPhongMaterial({
  color: 0xA9A9A9, side: THREE.DoubleSide
});
var base = new THREE.Mesh(geometryBase, materialBase);
scene.add(base);
base.rotation.x = 1.5708;
base.position.set(0, 0, 0);

// Agua (otro cilindro dentro del vaso)
var geometryAgua = new THREE.CylinderGeometry(5.2, 4.5, 6, 32);
var materialAgua = new THREE.MeshPhongMaterial({
  color: 0x1E90FF,     // azul agua
  transparent: true,
  opacity: 0.6,
  side: THREE.DoubleSide
});
var agua = new THREE.Mesh(geometryAgua, materialAgua);
scene.add(agua);
agua.position.set(0, 3, 0);

// Borde del vaso (solo decorativo)
var geometryBorde = new THREE.TorusGeometry(5.8, 0.2, 16, 100);
var materialBorde = new THREE.MeshLambertMaterial({
  color: 0xB0C4DE
});
var borde = new THREE.Mesh(geometryBorde, materialBorde);
scene.add(borde);
borde.position.set(0, 12, 0);
borde.rotation.x = 1.5708;

///// LUZ Y SOMBRAS /////
var light = new THREE.PointLight(0xffffff, 1);
light.position.set(20, 20, 20);
scene.add(light);

var ambient = new THREE.AmbientLight(0x404040, 1.5);
scene.add(ambient);




//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
