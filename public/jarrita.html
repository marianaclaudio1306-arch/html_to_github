<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    import { RoundedBoxGeometry } from './js/RoundedBoxGeometry.js';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos
// Luces
var luzAmbiente = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(luzAmbiente);

var luz = new THREE.DirectionalLight(0xffffff, 1.2);
luz.position.set(10, 20, 10);
scene.add(luz);


//CUERPO 
var cuerpoGeo = new THREE.CylinderGeometry(1.4, 1.8, 4, 32)
var cuerpoMat = new THREE.MeshLambertMaterial({ color: 0xA0522D }) // color barro
var cuerpo = new THREE.Mesh(cuerpoGeo, cuerpoMat)
scene.add(cuerpo)
cuerpo.position.set(0, 2, 0)

//BASE
var baseGeo = new THREE.CylinderGeometry(0.9, 1.4, 0.6, 32)
var baseMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
var base = new THREE.Mesh(baseGeo, baseMat)
scene.add(base)
base.position.set(0, 0.3, 0)

//CUELLO
var cuelloGeo = new THREE.CylinderGeometry(1.1, 1.2, 1.2, 32)
var cuelloMat = new THREE.MeshLambertMaterial({ color: 0xA0522D })
var cuello = new THREE.Mesh(cuelloGeo, cuelloMat)
scene.add(cuello)
cuello.position.set(0, 4.6, 0)

//BORDE SUPERIOR
var bordeGeo = new THREE.TorusGeometry(1.1, 0.15, 16, 100)
var bordeMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
var borde = new THREE.Mesh(bordeGeo, bordeMat)
scene.add(borde)
borde.position.set(0, 5.2, 0)

//ASA 
var asaGeo = new THREE.TorusGeometry(0.9, 0.15, 16, 100, Math.PI)
var asaMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 })
var asa = new THREE.Mesh(asaGeo, asaMat)
scene.add(asa)
asa.position.set(1, 2.5, 0)
asa.rotation.z = -1.57




//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    


    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
