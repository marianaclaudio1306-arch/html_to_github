<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    import { RoundedBoxGeometry } from './js/RoundedBoxGeometry.js';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos
// Luces
var luzAmbiente = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(luzAmbiente);

var luz = new THREE.DirectionalLight(0xffffff, 1.2);
luz.position.set(10, 20, 10);
scene.add(luz);


//HAMBURGUESA 

// Plato
var platoGeo = new THREE.CylinderGeometry(4, 4, 0.25, 64);
var platoMat = new THREE.MeshStandardMaterial({ color: 0xffffff});
var plato = new THREE.Mesh(platoGeo, platoMat);
scene.add(plato);
plato.position.set(0, -1.7, 0);

// Pan de abajo
var panAbajoGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.6, 32);
var panAbajoMat = new THREE.MeshStandardMaterial({ color: 0xA97433});
var panAbajo = new THREE.Mesh(panAbajoGeo, panAbajoMat);
scene.add(panAbajo);
panAbajo.position.set(0, -1.4, 0);

// Carne
var carneGeo = new THREE.CylinderGeometry(2.3, 2.3, 0.5, 32);
var carneMat = new THREE.MeshStandardMaterial({ color: 0x4B2E05 });
var carne = new THREE.Mesh(carneGeo, carneMat);
scene.add(carne);
carne.position.set(0, -0.9, 0);

// Queso
var quesoGeo = new THREE.BoxGeometry(2.7, 0.1, 2.7);
var quesoMat = new THREE.MeshStandardMaterial({ color: 0xFFD700});
var queso = new THREE.Mesh(quesoGeo, quesoMat);
scene.add(queso);
queso.position.set(0, -0.65, 0);

// Jitomate
var jitomateGeo = new THREE.CylinderGeometry(2.4, 2.4, 0.15, 32);
var jitomateMat = new THREE.MeshStandardMaterial({ color: 0xC73E1D});
var jitomate = new THREE.Mesh(jitomateGeo, jitomateMat);
scene.add(jitomate);
jitomate.position.set(0, -0.5, 0);

// Lechuga
var lechugaGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.15, 32);
var lechugaMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
var lechuga = new THREE.Mesh(lechugaGeo, lechugaMat);
scene.add(lechuga);
lechuga.position.set(0, -0.35, 0);

// Pan de arriba
var panArribaGeo = new THREE.SphereGeometry(2.5, 32, 32, 0, 6.2832, 0, 1.5708);
var panArribaMat = new THREE.MeshStandardMaterial({ color: 0xA97433,});
var panArriba = new THREE.Mesh(panArribaGeo, panArribaMat);
scene.add(panArriba);
panArriba.position.set(0, -0.3, 0);



//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    


    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
