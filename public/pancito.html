<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos
    

// Base 
var panbase = new THREE.SphereGeometry(0.8, 16, 16);
var panMat = new THREE.MeshBasicMaterial({ color: 0xe0a060 }); // color pan dorado
var pancito = new THREE.Mesh(panbase, panMat);
pancito.scale.set(1.3, 0.7, 1.3);
pancito.position.set(0, -0.5, 0);
scene.add(pancito);

// Bolita
var bolita = new THREE.SphereGeometry(0.25, 16, 16);
var bolitaMat = new THREE.MeshBasicMaterial({ color: 0xd18b47 });
var bolitita = new THREE.Mesh(bolita, bolitaMat);
bolitita.position.set(0, 0.1, 0);
scene.add(bolitita);

//  huesitos
var huesito = new THREE.SphereGeometry(0.15, 16, 16);
var huesitoMat = new THREE.MeshBasicMaterial({ color: 0xd18b47 });

// Huesito 1
var huesito1 = new THREE.Mesh(huesito, huesitoMat);
huesito1.scale.set(1.8, 0.5, 0.5);
huesito1.rotation.z = Math.PI / 0.1;
huesito1.position.set(0.4, 0.1, 0);
scene.add(huesito1);

// Huesito 2
var huesito2 = new THREE.Mesh(huesito, huesitoMat);
huesito2.scale.set(1.8, 0.5, 0.5);
huesito2.rotation.z = -Math.PI / 0.1;
huesito2.position.set(-0.4, 0.1, 0);
scene.add(huesito2);

// Huesito 3 (al frente)
var huesito3 = new THREE.Mesh(huesito, huesitoMat);
huesito3.scale.set(1.8, 0.5, 0.5);
huesito3.rotation.y = Math.PI / 2;
huesito3.position.set(0, 0.1, 0.4);
scene.add(huesito3);

// Huesito 4 (atrás)
var huesito4 = new THREE.Mesh(huesito, huesitoMat);
huesito4.scale.set(1.8, 0.5, 0.5);
huesito4.rotation.y = -Math.PI / -2;
huesito4.position.set(0, 0.1, -0.4);
scene.add(huesito4);

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
