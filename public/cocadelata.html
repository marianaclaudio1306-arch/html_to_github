<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    import { RoundedBoxGeometry } from './js/RoundedBoxGeometry.js';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos







// Luz ambiental (ilumina todo)
var luces = new THREE.AmbientLight(0xFFFFFF, 1.2);
scene.add(luces);

// Luz principal (tipo foco)
var sl01 = new THREE.SpotLight(0xFFFFFF, 1, 200, 0.36, 0.5, 0);
scene.add(sl01);
sl01.target.position.set(0, 0, 0);
scene.add(sl01.target);
sl01.position.set(0, 60, 20);

/// LATA DE REFRESCO

// CUERPO (con textura)
var textura = new THREE.TextureLoader().load('./imagenes/cocaa.jpg'); 
var cuerpoGeo = new THREE.CylinderGeometry(5, 5, 12, 32);
var cuerpoMat = new THREE.MeshLambertMaterial({ map: textura });
var cuerpo = new THREE.Mesh(cuerpoGeo, cuerpoMat);
scene.add(cuerpo);
cuerpo.position.set(0, 0, 0);

// TAPA SUPERIOR
var tapaSupGeo = new THREE.CylinderGeometry(5, 5, 0.5, 32);
var tapaSupMat = new THREE.MeshLambertMaterial({ color: 0x595959});
var tapaSup = new THREE.Mesh(tapaSupGeo, tapaSupMat);
scene.add(tapaSup);
tapaSup.position.set(0, 6.3, 0);

// TAPA INFERIOR
var tapaInfGeo = new THREE.CylinderGeometry(5, 5, 0.5, 32);
var tapaInfMat = new THREE.MeshLambertMaterial({ color: 0x595959});
var tapaInf = new THREE.Mesh(tapaInfGeo, tapaInfMat);
scene.add(tapaInf);
tapaInf.position.set(0, -6.3, 0);

/// PEQUEÑO BOTÓN DE ALUMINIO 
var botonGeo = new THREE.BoxGeometry(2, 0.2, 1);
var botonMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
var boton = new THREE.Mesh(botonGeo, botonMat);
scene.add(boton);
boton.position.set(0, 6.7, 2);



//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    


    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
