<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos



//  LUZ 
var luzSuave = new THREE.PointLight(0xFFFACD, 1.2, 100); // luz amarilla clara
luzSuave.position.set(10, 20, 10);
scene.add(luzSuave);

var luzAmbiente = new THREE.AmbientLight(0xCFE2F3, 0.6); // luz ambiental azulada
scene.add(luzAmbiente);



//  FLORECITA 


//  MATERIALES 
var materialPetalo = new THREE.MeshLambertMaterial({ color: 0xFF8D30 }); // rosa pastel
var materialCentro = new THREE.MeshLambertMaterial({ color: 0xFFDD00}); // amarillo cálido
var materialTallo  = new THREE.MeshLambertMaterial({ color: 0x2E8B57 }); // verde natural

// CENTRO DE LA FLOR
var centro = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), materialCentro);
scene.add(centro);
centro.position.set(0, 12, -25);

// PÉTALOS
var petalo1 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo1.position.set(3, 12, -25);
scene.add(petalo1);

var petalo2 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo2.position.set(-3, 12, -25);
scene.add(petalo2);

var petalo3 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo3.position.set(0, 15, -25);
scene.add(petalo3);

var petalo4 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo4.position.set(0, 9, -25);
scene.add(petalo4);

var petalo5 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo5.position.set(2.2, 14, -25);
scene.add(petalo5);

var petalo6 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo6.position.set(-2.2, 14, -25);
scene.add(petalo6);

var petalo7 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo7.position.set(-2, 10, -25);
scene.add(petalo7);

var petalo8 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), materialPetalo);
petalo8.position.set(2, 10, -25);
scene.add(petalo8);


// TALLO
var tallo = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 15, 16), materialTallo);
scene.add(tallo);
tallo.position.set(0, 4.5, -25);

      

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

   
    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
